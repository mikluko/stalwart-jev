name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: sarak.sh
  IMAGE: sarak.sh/mikluko/stalwart-jev
  CHART_REPOSITORY: oci://sarak.sh/mikluko/charts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
      - uses: https://github.com/actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - uses: https://github.com/azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Chart lints and renders
        run: |
          for f in charts/stalwart-jev/ci/*.yaml; do
            helm lint --strict charts/stalwart-jev -f "$f"
            helm template stalwart-jev charts/stalwart-jev -f "$f" > /dev/null
          done
      # Flux installs OCI charts as <version>+<digest>, and a label value
      # cannot hold the "+".
      - name: Chart labels survive build metadata
        run: |
          helm package charts/stalwart-jev --version 0.0.0+ci --destination "$RUNNER_TEMP/meta"
          ! helm template stalwart-jev "$RUNNER_TEMP/meta/stalwart-jev-0.0.0+ci.tgz" \
            -f charts/stalwart-jev/ci/api-key-values.yaml | grep -E '^\s+[a-z./-]+: .*\+ci'

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
      - name: Log in
        env:
          USER: ${{ secrets.REGISTRY_USER }}
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login "$REGISTRY" --username "$USER" --password-stdin
      # main is tagged main-<sha>-<unix time>; a vX.Y.Z tag as X.Y.Z.
      - name: Build and push
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tag=${GITHUB_REF#refs/tags/v} ;;
            refs/heads/main) tag=main-${GITHUB_SHA::7}-$(date +%s) ;;
            *) echo "nothing to push for $GITHUB_REF"; exit 0 ;;
          esac
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "$IMAGE:$tag" \
            .

  chart:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
      - uses: https://github.com/azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Package and push
        env:
          USER: ${{ secrets.REGISTRY_USER }}
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          version=${GITHUB_REF#refs/tags/v}
          printf '%s' "$TOKEN" | helm registry login "$REGISTRY" --username "$USER" --password-stdin
          helm package charts/stalwart-jev --version "$version" --app-version "$version" --destination "$RUNNER_TEMP/chart"
          helm push "$RUNNER_TEMP/chart/stalwart-jev-$version.tgz" "$CHART_REPOSITORY"
