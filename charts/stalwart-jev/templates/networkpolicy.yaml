{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stalwart-jev.fullname" . }}
  labels:
    {{- include "stalwart-jev.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "stalwart-jev.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.allowFrom | nindent 8 }}
      ports:
        - port: http
{{- end }}
